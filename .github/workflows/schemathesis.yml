name: Schemathesis (manual)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL backend yang diuji (staging/mock; jangan produksi)
        required: true
        default: http://localhost:8080
      max_examples:
        description: Jumlah contoh per operasi
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  schemathesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install schemathesis
      - name: Unduh spec dan jalankan
        env:
          GH_TOKEN: ${{ secrets.BACKEND_SPEC_TOKEN || github.token }}
          BASE_URL: ${{ inputs.base_url }}
          MAX_EXAMPLES: ${{ inputs.max_examples }}
          TOKEN: ${{ secrets.PASAREE_TEST_JWT }}
        run: contract/schemathesis.sh
